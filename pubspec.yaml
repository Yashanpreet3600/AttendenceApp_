publish_to: 'none'

version: 1.0.0+1

environment:
  # This fixes the error by forcing a modern SDK version
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Bundle
  firebase_core: ^3.6.0
  firebase_auth: ^5.2.0
